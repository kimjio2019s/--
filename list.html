<!DOCTYPE html>
<html lang="ko">
<head>

    <title>지오컴 - 목록 화면</title>
    <style>
        body {
            font-family: 'Malgun Gothic', sans-serif;
            padding: 50px;
            background-color: #ffffff;
        }
        .list-title {
            font-size: 32px;
            color: #333333;
            border-bottom: 2px solid #333333;
            padding-bottom: 10px;
            margin-bottom: 30px;
        }
        /* 목록 스타일 */
        .content-list {
            list-style-type: none;
            padding: 0;
        }
        .content-list li {
            font-size: 18px;
            border-bottom: 1px solid #ddd;
            transition: background-color 0.2s;
        }
        .content-list li:hover {
            background-color: #f5f5f5;
        }
        /* 링크 스타일 */
        .content-list a {
            text-decoration: none;
            color: #333333;
            display: block;
            padding: 20px;
        }
    </style>
</head>
<body>
