<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>지오컴 사이트</title>
    <style>
        body {
            font-family: 'Malgun Gothic', sans-serif;
            text-align: center;
            padding-top: 100px;
            background-color: #f9f9f9;
        }
        .welcome-title {
            font-size: 45px;
            color: #333333;
            margin-bottom: 20px;
        }
        .subtitle {
            font-size: 18px;
            color: #666666;
            margin-bottom: 40px; /* 버튼과의 간격을 줍니다 */
        }
        /* 시작하기 버튼 스타일 */
        .start-btn {
            display: inline-block;
            padding: 15px 40px;
            font-size: 18px;
            color: #ffffff;
            background-color: #007bff; /* 파란색 버튼 */
            text-decoration: none; /* 밑줄 제거 */
            border-radius: 5px; /* 테두리 둥글게 */
            font-weight: bold;
            transition: background-color 0.3s;
        }
        /* 버튼에 마우스를 올렸을 때의 효과 */
        .start-btn:hover {
            background-color: #0056b3; /* 더 어두운 파란색으로 변경 */
        }
    </style>
</head>
<body>

    <h1 class="welcome-title">지오컴 사이트에 들어온 것을 환영합니다</h1>
    <p class="subtitle">안녕하세요, 지오컴 사이트에 오신 것을 환영합니다</p>

    <!-- 시작하기 버튼 (누르면 list.html로 이동) -->
    <a href="list.html" class="start-btn">시작하기</a>

</body>
</html>
